<!DOCTYPE html>
<html lang="en-ca">
<head>
<title>Czerynne's Little Museum</title>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=AR+One+Sans:wght@400..700&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

<style>

  h1 {
      margin: 0;
      text-align: center;
      padding-top: 50px;
      padding-bottom: 25px;
      font-size: 2.5em;
      font-family: "Fredoka", sans-serif;
      color: rgb(255, 130, 172);
    }
  
    nav {
      font-family: "AR One Sans", sans-serif;
      text-align: center;
    }
    
    a {
        color: rgb(0, 0, 0);
        text-decoration: none;
    }

    a:hover {
        background-color: rgb(255, 204, 230);
        font-size: 18px;
    }
    
    body {
        margin: 0;
        text-align: center;
        color: rgb(0, 0, 0); 
        font-size: 1em;
        font-family: "AR One Sans", sans-serif;
    }
    
    div {
      margin: 25px;
      text-align: left;
    }
    
    li {
      display: inline-block;
      margin-right: 20px;
      list-style: none;
    }
    
    #section0, #section1, #section2, #section3, #section4 {
      height: 1000px;
      background-color: white;
    }

    .container {
        display: grid;
        grid-template-columns: 40% 60%;
        background-color: rgb(255, 247, 230);
        padding: 15px;
        gap: 20px;
    }
  
    .container div {
        padding: 30px;
        text-align: right;
    }

    /* ✅ RESPONSIVE DESIGN */

    /* MOBILE (under 600px) */
    @media screen and (max-width: 600px) {
      body {
        background-color: white;
        font-size: 0.75em;
      }

      img, p {
        width: 100%;
      }

      .container {
        grid-template-columns: 100%;
      }
    }

    /* DESKTOP (600px and up) */
    @media screen and (min-width: 600px) {
      img {
        width: 800px;
      }

      p {
        width: 600px;
      }
    }

</style>
</head>

<body>
  <h1>Czerynne's Little Museum</h1>

  <nav>
    <ul>
      <li><a href="#section0">Home</a></li>
      <li><a href="#section1">Figurine Friends</a></li>
      <li><a href="#section2">Miscellaneous</a></li>
      <li><a href="#section3">Fluffy Pegboard</a></li>
      <li><a href="#section4">Media</a></li>
    </ul>
  </nav>

  <div id="section0">Home</div>
  <div id="section1">Figurine Friends</div>
  <div id="section2">Miscellaneous</div>
  <div id="section3">Fluffy Pegboard</div>
  <div id="section4">Media</div>
    
</body>
</html>
